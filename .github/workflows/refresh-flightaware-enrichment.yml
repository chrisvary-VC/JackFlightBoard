name: Refresh FlightAware enrichment

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the 10-mile FlightAware cache
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
        run: node scripts/update-flightaware-enrichment.mjs
      - name: Commit updated enrichment data
        run: |
          if git diff --quiet -- flightaware-enrichment.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flightaware-enrichment.json
          git commit -m "Refresh FlightAware enrichment"
          git push
