  /* ==========================================================
     JACK'S FLIGHTBOARD · single-plane LED hero board
     Center: Auburn University — 32.604052, -85.490536
     Display face: Doto (variable dot-matrix, vector = crisp at any DPI)
     Mascot: Auburn captain tiger, subtly behind the right side
     ========================================================== */
  :root{
    --wall:#0f0d0b;
    --bezel:#1c1c1e;
    --board:#080a0b;
    --panel:#0b0d0e;
    --led:#f6f3e8;
    --led-dim:#9b978a;
    --amber:#ffbe4d;
    --auburn:#e87722;   /* Auburn orange, used sparingly */
    --green:#79ffa0;
    --red:#ff6f63;
    --mono:'IBM Plex Mono', monospace;
    --dot:'Doto', monospace;
    --w-black:900; --w-bold:800; --w-med:600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--wall);
    background-image:radial-gradient(1500px 950px at 74% -14%, #23201a 0%, transparent 56%);
    font-family:var(--mono);color:var(--led);overflow:hidden;
  }
  .stage{
    width:1920px;height:1080px;margin:0 auto;
    display:flex;flex-direction:column;gap:18px;
    padding:22px 30px 26px;transform-origin:top left;position:relative;
  }
  @media (max-width:1920px){ body{overflow:auto} }

  /* ---------- board chrome ---------- */
  .board{
    position:relative;background:var(--board);border-radius:14px;
    border:6px solid var(--bezel);overflow:hidden;
    box-shadow:0 2px 0 rgba(255,255,255,.05) inset,0 22px 50px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.5);
  }
  .board .led-bg{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle, rgba(246,243,232,.045) 0 1.1px, transparent 1.7px);
    background-size:8px 8px;
  }
  .board .sheen{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,.04) 0%, transparent 20%);
  }
  .board > *:not(.led-bg):not(.sheen):not(.mascot){position:relative;z-index:3}
  .dot{font-family:var(--dot);font-weight:var(--w-black)}
  .glow{text-shadow:0 0 12px rgba(246,243,232,.25)}
  .glow-amber{text-shadow:0 0 16px rgba(255,190,77,.45)}
  .k{font-family:var(--mono);font-weight:var(--w-med);color:var(--led-dim);letter-spacing:.22em;text-transform:uppercase}

                       linear-gradient(0deg, transparent 3%, #000 26%);

  .mascot::after{ /* light scrim on the left only, so type stays readable but he's brighter */
    content:"";position:absolute;z-index:1;inset:0;
    background:linear-gradient(90deg, var(--board) 0%, rgba(8,10,11,.24) 48%, transparent 100%);
  }
  .mascot::before{
    content:"";position:absolute;z-index:2;left:284px;top:146px;width:120px;height:44px;opacity:0;pointer-events:none;
    background:radial-gradient(circle at 16% 50%,rgba(255,235,146,1) 0 3px,rgba(255,141,32,.92) 4px,transparent 12px),
               radial-gradient(circle at 84% 50%,rgba(255,235,146,1) 0 3px,rgba(255,141,32,.92) 4px,transparent 12px);
    filter:drop-shadow(0 0 8px #ff8a24) drop-shadow(0 0 16px rgba(255,91,22,.9));mix-blend-mode:screen;
  }
  .mascot.eyes-glow::before{animation:tigerEyes 1.35s ease-in-out both}
  @keyframes tigerEyes{0%,100%{opacity:0}18%,68%{opacity:1}42%{opacity:.48}54%{opacity:1}}

  /* ---------- header ---------- */
  .header{height:98px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;flex:0 0 auto}
  .header h1{font-family:var(--dot);font-weight:var(--w-black);font-size:52px;line-height:1}
  .header h1 .ap{color:var(--amber)}
  .header .sub{font-size:13px;margin-top:6px}
  .header .mid{display:flex;gap:46px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:3px}
  .chip .v{font-family:var(--dot);font-weight:var(--w-black);font-size:44px;line-height:1}
  .chip .k{font-size:11px}
  .clockwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  #clock{font-family:var(--dot);font-weight:var(--w-black);font-size:54px;line-height:1}
  .wind-widget{display:flex;flex-direction:column;align-items:center;gap:2px;margin-right:10px}
  .wind-top{display:flex;align-items:center;gap:12px}
  .wind-spd{font-family:var(--dot);font-weight:var(--w-black);font-size:38px;line-height:1}
  .wind-unit{font-family:var(--mono);font-size:14px;color:var(--led-dim);margin-left:3px}
  .wind-bot{font-family:var(--dot);font-weight:var(--w-bold);font-size:22px;display:flex;gap:8px;align-items:center}
  .wind-sep{color:var(--led-dim)}
  .status{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2em}
  .live-controls{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .tower-control{display:inline-flex;align-items:center;gap:8px;padding:4px 9px;border:1px solid #34373a;border-radius:6px;background:rgba(13,15,17,.72);color:var(--led-dim);font-family:var(--mono);cursor:pointer;white-space:nowrap;transition:border-color .18s ease,color .18s ease,background .18s ease}
  .tower-control:hover,.tower-control:focus-visible{border-color:var(--amber);background:rgba(255,190,77,.08);color:var(--led);outline:none}
  .tower-control .tower-icon{color:var(--led-dim);font-size:16px;line-height:1}
  .tower-control .tower-lamp{width:9px;height:9px;border-radius:50%;background:#555;box-shadow:none;flex:0 0 auto}
  .tower-control .tower-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
  .tower-control strong{font-size:10px;letter-spacing:.12em;color:inherit}
  .tower-control small{font-size:8px;letter-spacing:.1em;color:var(--led-dim);margin-top:3px}
  .tower-control[data-state="connecting"]{border-color:rgba(255,190,77,.5);color:var(--amber)}
  .tower-control[data-state="connecting"] .tower-lamp{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 1s ease-in-out infinite}
  .tower-control[data-state="listening"]{border-color:rgba(121,255,160,.55);color:var(--green);background:rgba(121,255,160,.06)}
  .tower-control[data-state="listening"] .tower-lamp{background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2s ease-in-out infinite}
  .tower-control[data-state="blocked"]{border-color:rgba(255,190,77,.5);color:var(--amber)}
  .data-credit{font-size:9px;letter-spacing:.12em;color:var(--led-dim);white-space:nowrap}
  .data-credit a{color:var(--led);font-weight:600;text-decoration:none}
  .data-credit a:hover{color:var(--amber)}
  .lamp{width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);animation:pulse 2s ease-in-out infinite}
  .status.demo .lamp{background:var(--amber);box-shadow:0 0 14px var(--amber)}
  @keyframes pulse{50%{opacity:.4}}

  /* ---------- aircraft changeover ---------- */
  .plane-transition{
    position:absolute;z-index:30;left:840px;top:500px;width:720px;height:430px;
    pointer-events:none;overflow:visible;animation:flyThrough 1.55s cubic-bezier(.25,.04,.6,.98) both;
  }
  .plane-transition::before{
    content:"";position:absolute;z-index:-2;left:-930px;top:218px;width:980px;height:13px;border-radius:50%;
    background:linear-gradient(90deg,transparent,rgba(246,243,232,.05) 12%,rgba(246,243,232,.62) 76%,rgba(246,243,232,.08));
    filter:blur(5px);transform:rotate(1.5deg);
  }
  .plane-transition::after{
    content:"";position:absolute;z-index:-1;left:-900px;top:228px;width:950px;height:4px;border-radius:50%;
    background:linear-gradient(90deg,transparent,rgba(242,101,34,.12) 18%,rgba(242,101,34,.88) 82%,rgba(242,101,34,.12));
    box-shadow:0 0 12px rgba(242,101,34,.38);transform:rotate(1.5deg);
  }
  .plane-transition .fly-plane{
    display:block;position:absolute;left:0;top:0;width:700px;height:auto;
    filter:drop-shadow(0 22px 19px rgba(0,0,0,.62));
  }
  .fly-light{position:absolute;width:7px;height:7px;border-radius:50%;animation:navBlink .42s ease-in-out infinite alternate}
  .fly-light.port{left:66px;top:145px;background:#ff554e;box-shadow:0 0 13px #ff554e}
  .fly-light.starboard{right:61px;top:120px;background:#69ffab;box-shadow:0 0 13px #69ffab}
  @keyframes navBlink{from{opacity:.35}to{opacity:1}}
  @keyframes flyThrough{
    0%{transform:translate3d(0,170px,0) rotate(-2deg) scale(1.62);opacity:0}
    9%{opacity:1}
    52%{transform:translate3d(560px,-120px,0) rotate(-2deg) scale(.72);opacity:1}
    88%{opacity:1}
    100%{transform:translate3d(1180px,-290px,0) rotate(-1deg) scale(.2);opacity:0}
  }

  /* ---------- HERO plane board ---------- */
  .hero{flex:1;min-height:0;display:grid;grid-template-rows:1fr 342px auto;gap:20px;padding:26px 40px 20px}

  .hero-top{display:grid;grid-template-columns:880px 1fr;gap:44px;min-height:0}
  .photo{border-radius:12px;overflow:hidden;position:relative;background:#0d0f11;border:1px solid #23262a;min-height:0}
  .photo img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(1.06)}
  .photo .credit{position:absolute;left:0;bottom:0;font-size:12px;padding:6px 12px;background:rgba(0,0,0,.72);color:#c8c4b6;letter-spacing:.06em;text-decoration:none}
  .photo .credit:hover{color:var(--amber)}
  .photo .photo-badge{position:absolute;right:12px;top:12px;padding:6px 10px;border:1px solid rgba(255,190,77,.45);border-radius:5px;background:rgba(8,10,11,.78);color:var(--amber);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .photo .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--dot);font-weight:var(--w-bold);font-size:30px;color:var(--led-dim)}

  .idcol{display:flex;flex-direction:column;justify-content:flex-start;gap:18px;min-width:0;padding-top:34px}
  .logo-row{display:flex;align-items:center;gap:24px}
  .logo-tile{width:116px;height:116px;border-radius:10px;background:var(--tilebg,#20242e);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
  .logo-tile img{width:74%;height:74%;object-fit:contain}
  .logo-tile .fallback{font-family:var(--dot);font-weight:var(--w-black);font-size:50px}
  .idcol .airline{font-family:var(--dot);font-weight:var(--w-black);font-size:62px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idcol .callsign{font-family:var(--dot);font-weight:var(--w-bold);font-size:40px;color:var(--amber);line-height:1}
  .idcol .type{font-family:var(--dot);font-weight:var(--w-bold);font-size:38px;line-height:1}
  .route{margin-top:auto;width:100%;max-width:760px;min-height:112px;padding:12px 14px;border-radius:10px;background:linear-gradient(90deg,rgba(5,7,8,.68),rgba(5,7,8,.46),rgba(5,7,8,.68));border:1px solid rgba(255,190,77,.1)}
  .route-card{display:grid;grid-template-columns:124px minmax(400px,1fr) 124px;gap:16px;align-items:center;width:100%;min-height:86px}
  .route-stop:last-child{text-align:right}
  .route-stop .code{font-family:var(--dot);font-weight:var(--w-black);font-size:44px;line-height:.9}
  .route-stop .city{font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--led-dim)}
  .route-label{font-size:9px;letter-spacing:.18em;margin-bottom:6px;color:var(--amber)}
  .route-track{position:relative;height:84px}
  .route-arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .route-arc path{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,190,77,.55))}
  .route-arc circle{fill:var(--amber);filter:drop-shadow(0 0 6px rgba(255,190,77,.85))}
  .route-plane{position:absolute;z-index:1;left:calc(var(--progress) * 1%);top:var(--plane-y);transform:translate(-50%,-50%);font-family:var(--dot);font-size:34px;color:var(--amber);line-height:1;text-shadow:0 0 2px var(--board),0 0 10px rgba(255,190,77,.85)}
  .route-progress{position:absolute;left:50%;top:74px;transform:translateX(-50%);font-size:9px;letter-spacing:.14em;color:var(--led-dim);white-space:nowrap}
  .route-pending{min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center}
  .route-pending .pending-title{font-family:var(--dot);font-weight:var(--w-black);font-size:34px;color:var(--led-dim)}

  /* data strip */
  .strip{background:var(--panel);border:1px solid #1e2124;border-radius:12px;
    display:grid;grid-template-columns:390px 350px 1fr;gap:34px;padding:20px 30px;align-items:center;position:relative;overflow:hidden}
  .strip .led-bg{border-radius:12px}

/* =============== MATH =============== */
const R_MI=3958.8, d2r=d=>d*Math.PI/180, r2d=r=>r*180/Math.PI;
function distMi(la1,lo1,la2,lo2){
  const a=Math.sin(d2r(la2-la1)/2)**2+Math.cos(d2r(la1))*Math.cos(d2r(la2))*Math.sin(d2r(lo2-lo1)/2)**2;
  return 2*R_MI*Math.asin(Math.sqrt(a));
}
function bearing(la1,lo1,la2,lo2){
  const y=Math.sin(d2r(lo2-lo1))*Math.cos(d2r(la2));
  const x=Math.cos(d2r(la1))*Math.sin(d2r(la2))-Math.sin(d2r(la1))*Math.cos(d2r(la2))*Math.cos(d2r(lo2-lo1));
  return (r2d(Math.atan2(y,x))+360)%360;
}
function project(lat,lon,brg,dMi){
  const dR=dMi/R_MI, br=d2r(brg), la1=d2r(lat), lo1=d2r(lon);
  const la2=Math.asin(Math.sin(la1)*Math.cos(dR)+Math.cos(la1)*Math.sin(dR)*Math.cos(br));
  const lo2=lo1+Math.atan2(Math.sin(br)*Math.sin(dR)*Math.cos(la1),Math.cos(dR)-Math.sin(la1)*Math.sin(la2));
  return [r2d(la2),r2d(lo2)];
}
const toWind=b=>WINDS[Math.round(b/22.5)%16];

/* =============== STATE =============== */
let flights=[], current=null, currentIdx=0, demoMode=false, rotateStart=Date.now(), flightAwareCache={}, transitioning=false;
let towerAudio=null, towerWanted=false;

const PHOTO_CACHE_KEY="jacks-flightboard-photo-cache-v1";
const PHOTO_CACHE_TTL=30*24*60*60*1000;
const photoMisses=new Set(), routeCache={}, aircraftCache={};

function loadPhotoCache(){
  try{
    const now=Date.now();
    const stored=JSON.parse(localStorage.getItem(PHOTO_CACHE_KEY)||"{}");
    return Object.fromEntries(Object.entries(stored).filter(([,photo])=>photo?.src&&now-(photo.savedAt||0)<PHOTO_CACHE_TTL));
  }catch(e){ return {}; }
}
const photoCache=loadPhotoCache();

function rememberPhoto(key,photo){
  const saved={...photo,savedAt:Date.now()};
  photoCache[key]=saved;
  try{
    const recent=Object.fromEntries(Object.entries(photoCache).sort((a,b)=>(b[1].savedAt||0)-(a[1].savedAt||0)).slice(0,80));
    localStorage.setItem(PHOTO_CACHE_KEY,JSON.stringify(recent));
  }catch(e){}
  return saved;
}

// Safari versions used by some smart displays do not implement
// AbortSignal.timeout(). Use a standard AbortController instead so the live
// feeds work consistently on the hosted page as well as locally.
async function timedFetch(url, options={}, timeoutMs=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    return await fetch(url,{...options,signal:controller.signal});
  }finally{
    clearTimeout(timer);
  }
}

/* =============== DATA =============== */
async function fetchFlights(){
  const nm=Math.round(CONFIG.radiusMiles*0.868976);
  // api.airplanes.live has the same OpenSky-style response shape as adsb.lol
  // but includes the browser CORS header required by GitHub Pages.
  const url=`https://api.airplanes.live/v2/point/${CONFIG.lat}/${CONFIG.lon}/${nm}`;
  const res=await timedFetch(url,{},8000);
  if(!res.ok) throw new Error("airplanes.live "+res.status);
  const data=await res.json();
  return (data.ac||[]).filter(a=>a.lat!=null&&a.lon!=null).map(a=>{
    const alt=(a.alt_baro==="ground")?0:(a.alt_baro??a.alt_geom??null);
    return {
      hex:a.hex, callsign:(a.flight||"").trim()||a.r||a.hex.toUpperCase(),
      reg:a.r||"", type:(a.t||"").toUpperCase(),
      lat:a.lat, lon:a.lon, altFt:alt,
      gsMph:a.gs!=null?a.gs*1.15078:0,
      track:a.track??a.true_heading??0,
      vrFpm:a.baro_rate??a.geom_rate??0,
      lastReal:Date.now()
    };
  }).filter(f=>f.altFt!==0);
}
async function loadFlightAwareCache(){
  try{
    const res=await timedFetch(`flightaware-enrichment.json?ts=${Date.now()}`,{},5000);
    if(res.ok) flightAwareCache=(await res.json()).flights||{};
  }catch(e){ flightAwareCache={}; }
}
function applyFlightAwareEnrichment(list){
  for(const f of list){
    const extra=flightAwareCache[(f.callsign||"").trim().toUpperCase()];
    if(!extra) continue;
    f.flightAware=extra;
    if(extra.aircraftType) f.type=extra.aircraftType;
    if(extra.origin?.lat!=null&&extra.origin?.lon!=null&&extra.destination?.lat!=null&&extra.destination?.lon!=null){
      f.orig=extra.origin;
      f.dest=extra.destination;
      f.route=`${extra.origin.code} – ${extra.destination.code}`;
    }
  }
}
async function enrichAircraftDetails(list){
  await Promise.all(list.map(async f=>{
    const key=(f.reg||f.hex||"").toUpperCase();
    if(!key) return;
    if(aircraftCache[key]===undefined){
      try{
        const res=await timedFetch(`https://api.adsbdb.com/v0/aircraft/${encodeURIComponent(key)}`,{},6000);
        aircraftCache[key]=res.ok?(await res.json()).response?.aircraft||null:null;
      }catch(e){ aircraftCache[key]=null; }
    }
    const aircraft=aircraftCache[key];
    if(!aircraft) return;
    if(!f.reg&&aircraft.registration) f.reg=aircraft.registration;
    if(!f.type&&aircraft.icao_type) f.type=aircraft.icao_type.toUpperCase();
    const manufacturer=(aircraft.manufacturer||"").trim(), model=(aircraft.type||"").trim();
    const reportedName=model&&manufacturer&&!model.toLowerCase().startsWith(manufacturer.toLowerCase())
      ? `${manufacturer} ${model}`
      : model||manufacturer;
    if(reportedName) f.typeName=reportedName;
  }));
  // Auburn student callsigns are normally Skyhawks. Keep a reported aircraft
  // type, but make the training-fleet identity useful when it is omitted.
  list.filter(f=>isAuburnCallsign(f.callsign)&&!f.type).forEach(f=>f.type="C172");
}
const DEMO=[
  {hex:"a1b2c3",callsign:"DAL1902",reg:"N512DN",type:"A21N",lat:32.86,lon:-85.66,altFt:33800,gsMph:534,track:248,vrFpm:0},
  {hex:"d4e5f6",callsign:"AAL2210",reg:"N822NN",type:"B738",lat:32.44,lon:-85.28,altFt:14200,gsMph:372,track:58,vrFpm:1720},
  {hex:"a9c8e1",callsign:"SWA414",reg:"N8642E",type:"B38M",lat:32.74,lon:-85.24,altFt:21600,gsMph:428,track:302,vrFpm:-1180},
  {hex:"f1a2b3",callsign:"DAL77",reg:"N705TW",type:"B752",lat:32.42,lon:-85.74,altFt:38000,gsMph:560,track:92,vrFpm:0}
];
async function getRoutes(list){
  const load=async f=>{
    const callsign=(f.callsign||"").trim().toUpperCase();
    if(!callsign) return;
    if(routeCache[callsign]===undefined){
      try{
        const res=await timedFetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`,{},6000);
        if(!res.ok){ routeCache[callsign]=null; return; }
        const route=(await res.json()).response?.flightroute;
        routeCache[callsign]=route?.origin&&route?.destination?route:null;
      }catch(e){ routeCache[callsign]=null; }
    }
    const route=routeCache[callsign];
    if(!route) return;
    f.airline=route.airline?{n:route.airline.name,i:route.airline.iata||route.airline.icao||"",c:"#9da6b1"}:null;
    f.route=`${route.origin.iata_code||route.origin.icao_code} – ${route.destination.iata_code||route.destination.icao_code}`;
    f.orig={code:route.origin.iata_code||route.origin.icao_code,city:route.origin.municipality||route.origin.name,lat:route.origin.latitude,lon:route.origin.longitude};
    f.dest={code:route.destination.iata_code||route.destination.icao_code,city:route.destination.municipality||route.destination.name,lat:route.destination.latitude,lon:route.destination.longitude};
  };
  await Promise.all(list.map(load));
}

async function commonsPhoto(search, requiredText=""){
  const blocked="-sink -restroom -interior -cabin -cockpit -seat -window -meal";
  const params=new URLSearchParams({
    action:"query",generator:"search",gsrsearch:`${search} ${blocked}`,
    gsrnamespace:"6",gsrlimit:"8",prop:"imageinfo",
    iiprop:"url|extmetadata",iiurlwidth:"900",format:"json",origin:"*"
  });
  const res=await timedFetch(`https://commons.wikimedia.org/w/api.php?${params}`,{},7000);
  if(!res.ok) return null;
  const data=await res.json();
  const reject=/sink|restroom|interior|cabin|cockpit|seat|window|meal|engine detail/i;
  const pages=Object.values(data.query?.pages||{}).filter(item=>!reject.test(item.title||""));
  const page=requiredText
    ? pages.find(item=>item.title?.toUpperCase().includes(requiredText.toUpperCase()))
    : pages[0];
  const info=page?.imageinfo?.[0];
  return info?.thumburl?{src:info.thumburl,link:info.descriptionurl}:null;
}

async function getPhoto(hex, reg, type, callsign, reportedTypeName=""){
  if(isAuburnCallsign(callsign)){
    return {src:AUBURN_SKYHAWK_PHOTO,credit:"Auburn Skyhawk training fleet",exact:false,livery:false,auburn:true};
  }

  // First choice: the exact aircraft registration.
  if(reg){
    const exactKey=`REG:${reg.toUpperCase()}`;
    if(photoCache[exactKey]) return photoCache[exactKey];
    if(!photoMisses.has(exactKey)){
      try{
        const exact=await commonsPhoto(`${reg} aircraft`,reg);
        if(exact) return rememberPhoto(exactKey,{...exact,credit:"Exact aircraft · Wikimedia Commons",exact:true,livery:false});
      }catch(e){}
      photoMisses.add(exactKey);
    }
  }

  // Second choice: a matching airline + aircraft-type photo. This gives an
  // honest livery representation when an exact registration photo is absent.
  const airline=airlineFor(callsign||"");
  const typeName=reportedTypeName||TYPES[type]||type||"";
  if(airline?.i&&typeName){
    const liveryKey=`LIVERY:${airline.i}:${(type||typeName).toUpperCase()}`;
    if(photoCache[liveryKey]) return photoCache[liveryKey];
    if(!photoMisses.has(liveryKey)){
      try{
        const livery=await commonsPhoto(`${airline.n} ${typeName}`);
        if(livery) return rememberPhoto(liveryKey,{...livery,credit:`${airline.n} livery · Wikimedia Commons`,exact:false,livery:true});
      }catch(e){}
      photoMisses.add(liveryKey);
    }
  }

  // A real type reference is especially useful for private aircraft, which
  // often have no registration photo and no airline livery to fall back to.
  if(typeName){
    const typeKey=`TYPE:${(type||typeName).toUpperCase()}`;
    if(photoCache[typeKey]) return photoCache[typeKey];
    if(!photoMisses.has(typeKey)){
      try{
        const typePhoto=await commonsPhoto(`${typeName} aircraft`);
        if(typePhoto) return rememberPhoto(typeKey,{...typePhoto,credit:`${typeName} reference · Wikimedia Commons`,exact:false,livery:false,reference:true});
      }catch(e){}
      photoMisses.add(typeKey);
    }
  }

  // Only after every useful photo lookup fails, show the Auburn fleet image
  // without pretending that it depicts the exact aircraft on screen.
  return {src:NO_PLANE_FALLBACK,exact:false,livery:false,fallback:true};
}

/* =============== HELPERS =============== */
function isAuburnCallsign(cs){ return /^AUB\d+$/.test((cs||"").trim().toUpperCase()); }
function airlineFor(cs){
  const callsign=(cs||"").trim().toUpperCase();
  if(isAuburnCallsign(callsign)) return AIRLINES.AUB;
  const m=callsign.match(/^[A-Z]{3}/);
  return m&&AIRLINES[m[0]]?AIRLINES[m[0]]:null;
}
function withDelta(f){ f.dist=distMi(CONFIG.lat,CONFIG.lon,f.lat,f.lon); f.brg=bearing(CONFIG.lat,CONFIG.lon,f.lat,f.lon); return f; }
function roseSVG(brg){
  const cx=90,cy=90,r=80,px=cx+r*0.8*Math.sin(d2r(brg)),py=cy-r*0.8*Math.cos(d2r(brg));
  return `<svg class="rose" viewBox="0 0 180 180" aria-hidden="true">
    <circle cx="90" cy="90" r="80" fill="none" stroke="#3a382f" stroke-width="2.5"/>
    <circle cx="90" cy="90" r="52" fill="none" stroke="#26241e" stroke-width="1.5"/>
    ${[0,45,90,135,180,225,270,315].map(a=>{
      const s=a%90===0?70:74;
      return `<line x1="${cx+s*Math.sin(d2r(a))}" y1="${cy-s*Math.cos(d2r(a))}" x2="${cx+80*Math.sin(d2r(a))}" y2="${cy-80*Math.cos(d2r(a))}" stroke="#6b675a" stroke-width="2.5"/>`;
    }).join("")}
    <text x="90" y="21" fill="#b8b3a4" font-size="17" font-weight="bold" text-anchor="middle" font-family="monospace">N</text>
    <text x="90" y="171" fill="#5a5750" font-size="14" text-anchor="middle" font-family="monospace">S</text>
    <line x1="90" y1="90" x2="${px}" y2="${py}" stroke="#ffbe4d" stroke-width="4"/>
    <circle cx="${px}" cy="${py}" r="9" fill="#ffbe4d" style="filter:drop-shadow(0 0 8px #ffbe4d)"/>
    <circle cx="90" cy="90" r="5.5" fill="#f6f3e8"/>
  </svg>`;
}
const fmt=(n,u="")=>n==null?"———":Math.round(n).toLocaleString()+u;
function miniLogo(cs){
  const al=airlineFor(cs);
  if(al?.logo) return `<div class="mlogo"><img src="${al.logo}" alt="${al.n}"></div>`;
  if(al&&al.i) return `<div class="mlogo"><img src="https://www.gstatic.com/flights/airline_logos/70px/${al.i}.png" onerror="this.outerHTML='<div class=fb>${al.i}</div>'"></div>`;
  return `<div class="mlogo"><div class="fb dot">✈</div></div>`;
}

/* =============== LIVE MAP =============== */
function disposeFlightMap(){
  if(miniMap){ miniMap.remove(); miniMap=null; }
  miniMapPlane=null; miniMapLine=null;
}
function initFlightMap(f){
  const node=document.getElementById("flight-map"); if(!node) return;
  if(typeof window.L==="undefined"){
    node.innerHTML=`<div class="map-fallback">MAP UNAVAILABLE<br>${f.lat.toFixed(3)}, ${f.lon.toFixed(3)}</div>`;
    return;
  }
  const L=window.L;
  miniMap=L.map(node,{zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,fadeAnimation:false,zoomAnimation:false,markerZoomAnimation:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    updateWhenIdle:true,
    keepBuffer:1,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'
  }).addTo(miniMap);
  L.circleMarker([CONFIG.lat,CONFIG.lon],{radius:5,color:"#f26522",weight:2,fillColor:"#03244d",fillOpacity:1,interactive:false}).addTo(miniMap);
  miniMapLine=L.polyline([[CONFIG.lat,CONFIG.lon],[f.lat,f.lon]],{color:"#ffbe4d",weight:2,opacity:.68,dashArray:"3 7",interactive:false}).addTo(miniMap);
  const icon=L.divIcon({
    className:"map-plane-icon",
    html:`<span style="transform:rotate(${Math.round(f.track||0)}deg)">✈</span>`,
    iconSize:[30,30],iconAnchor:[15,15]
  });
  miniMapPlane=L.marker([f.lat,f.lon],{icon,interactive:false}).addTo(miniMap);
  const bounds=L.latLngBounds([[CONFIG.lat,CONFIG.lon],[f.lat,f.lon]]);
  if(bounds.isValid()&&distMi(CONFIG.lat,CONFIG.lon,f.lat,f.lon)>.15) miniMap.fitBounds(bounds,{padding:[42,42],maxZoom:13,animate:false});
  else miniMap.setView([CONFIG.lat,CONFIG.lon],13,{animate:false});
  setTimeout(()=>miniMap?.invalidateSize(false),0);
}
function updateFlightMap(f){
  if(miniMapPlane){
    miniMapPlane.setLatLng([f.lat,f.lon]);
    miniMapLine?.setLatLngs([[CONFIG.lat,CONFIG.lon],[f.lat,f.lon]]);
    const glyph=miniMapPlane.getElement()?.querySelector("span");
    if(glyph) glyph.style.transform=`rotate(${Math.round(f.track||0)}deg)`;
    return;
  }
  const fallback=document.querySelector("#flight-map .map-fallback");
  if(fallback) fallback.innerHTML=`MAP UNAVAILABLE<br>${f.lat.toFixed(3)}, ${f.lon.toFixed(3)}`;
}

/* =============== RENDER =============== */
function routeArcY(progress){
  const t=progress/100;
  return 54-88*t*(1-t);
}
function buildHero(f){
  withDelta(f);
  const al=f.airline||airlineFor(f.callsign);
  const tile=al
    ? `<div class="logo-tile" style="--tilebg:${al.c}22">
         <img src="${al.logo||`https://www.gstatic.com/flights/airline_logos/70px/${al.i}.png`}" alt="${al.n}"
              onerror="this.outerHTML='<div class=fallback dot>${al.i}</div>'"></div>`
    : `<div class="logo-tile"><div class="fallback dot glow">✈</div></div>`;
  const typeName=f.typeName||TYPES[f.type]||f.type||"Type not broadcast";
  const routeProgress=f.orig&&f.dest
    ? Math.min(96,Math.max(4,Math.round(100*distMi(f.orig.lat,f.orig.lon,f.lat,f.lon)/distMi(f.orig.lat,f.orig.lon,f.dest.lat,f.dest.lon))))
    : 0;
  const routeY=routeArcY(routeProgress);
  const routeHTML=f.orig&&f.dest
    ? `<div class="route-card">
         <div class="route-stop"><div class="route-label k">ORIGIN</div><div class="code glow">${f.orig.code}</div><div class="city k">${f.orig.city||""}</div></div>
         <div class="route-track" id="route-track" style="--progress:${routeProgress};--plane-y:${routeY}px"><svg class="route-arc" viewBox="0 0 420 84" preserveAspectRatio="none" aria-hidden="true"><path d="M 4 54 Q 210 8 416 54"/><circle cx="4" cy="54" r="5"/><circle cx="416" cy="54" r="5"/></svg><span class="route-plane">✈</span><span class="route-progress k" id="route-progress">APPROX. ${routeProgress}% COMPLETE</span></div>
         <div class="route-stop"><div class="route-label k">DESTINATION</div><div class="code glow">${f.dest.code}</div><div class="city k">${f.dest.city||""}</div></div>
       </div>`
    : `<div class="route-pending"><div class="pending-title glow">ROUTE NOT PUBLISHED</div></div>`;

  const hero=document.getElementById("hero");
  disposeFlightMap();
  hero.innerHTML=`
    <div class="led-bg"></div><div class="sheen"></div><div class="mascot"></div>
    <div class="hero-top">
      <div class="photo" data-hex="${f.hex}"><div class="noimg">ACQUIRING VISUAL…</div></div>
      <div class="idcol">
        <div class="logo-row">
          ${tile}
          <div style="min-width:0">
            <div class="airline glow">${al?al.n:f.callsign}</div>
            <div class="callsign glow-amber">${f.callsign}${f.reg?" · "+f.reg:""}</div>
          </div>
        </div>
        <div class="type glow">${typeName}</div>
        <div class="route">${routeHTML}</div>
      </div>
    </div>

    <div class="strip">
      <div class="led-bg"></div>
      <div class="map-panel">
        <div class="map-title k">APPROX. LIVE POSITION</div>
        <div id="flight-map" role="img" aria-label="Map showing the aircraft's approximate live position near Auburn"></div>
      </div>
      <div class="look">
        <div class="big">
          <div><div class="dist glow-amber"><span id="v-dist">${f.dist.toFixed(1)}</span><small>mi</small></div><div class="k">Distance</div></div>
          <div><div class="dir glow" id="v-dir">${toWind(f.brg)} · ${Math.round(f.brg)}°</div><div class="k">Look this way</div></div>
        </div>
      </div>
      <div class="tele">
        <div class="cell"><div class="k">Altitude</div><div class="v glow" id="v-alt">${fmt(f.altFt,"ft")}</div></div>
        <div class="cell"><div class="k">Ground speed</div><div class="v glow" id="v-spd">${fmt(f.gsMph,"mph")}</div></div>
        <div class="cell"><div class="k">Track</div><div class="v glow" id="v-trk">${Math.round(f.track)}° ${toWind(f.track)}</div></div>
        <div class="cell"><div class="k">Vertical rate</div><div class="v glow" id="v-vr">—</div></div>
      </div>
    </div>

    <div class="rot">
      <div class="top">
        <div class="idx" id="rotIdx">PLANE — OF —</div>
        <div class="bar"><div class="fill" id="rotFill"></div></div>
      </div>
      <div class="upnext" id="upnext"><span class="lbl">NEXT UP</span></div>
    </div>`;

  initFlightMap(f);
  getPhoto(f.hex, f.reg, f.type, f.callsign, f.typeName).then(p=>{
    const slot=hero.querySelector(`.photo[data-hex="${f.hex}"]`);
    if(!slot) return;
    if(!p){ slot.innerHTML=`<div class="noimg">${typeName}</div>`; return; }
    slot.replaceChildren();
    const img=document.createElement("img");
    img.src=p.src;
    img.alt=p.fallback?"Auburn aviation fleet":f.reg?`${typeName}, registration ${f.reg}`:typeName;
    if(p.fallback){
      img.style.objectFit="cover";
    }else if(!p.exact&&!p.auburn){
      img.style.objectFit="contain";
      img.style.padding="20px";
      img.style.filter="drop-shadow(0 4px 24px rgba(0,0,0,.7))";
    }
    img.addEventListener("error",()=>{
      img.src=NO_PLANE_FALLBACK;
      img.alt="Auburn aviation fleet";
      img.style.objectFit="cover";
      img.style.padding="0";
      img.style.filter="none";
      slot.querySelectorAll(".credit,.photo-badge").forEach(node=>node.remove());
    },{once:true});
    slot.appendChild(img);

    if(!p.fallback){
      const credit=document.createElement(p.link?"a":"div");
      credit.className="credit";
      credit.textContent=p.credit||typeName;
      if(p.link){ credit.href=p.link; credit.target="_blank"; credit.rel="noopener noreferrer"; }
      slot.appendChild(credit);
    }

    if(p.exact||p.livery||p.reference||p.auburn){
      const badge=document.createElement("div");
      badge.className="photo-badge";
      badge.textContent=p.exact?"Exact aircraft":p.livery?"Matching livery":p.auburn?"Auburn training fleet":"Reference type";
      slot.appendChild(badge);
    }
  });
  updateTele(f);
  renderUpNext();
}

function updateRouteProgress(f){
  if(!f.orig||!f.dest) return;
  const total=distMi(f.orig.lat,f.orig.lon,f.dest.lat,f.dest.lon);
  if(!total) return;
  const progress=Math.min(96,Math.max(4,Math.round(100*distMi(f.orig.lat,f.orig.lon,f.lat,f.lon)/total)));
  const track=document.getElementById("route-track");
  const label=document.getElementById("route-progress");
  if(track){
    track.style.setProperty("--progress",progress);
    track.style.setProperty("--plane-y",`${routeArcY(progress)}px`);
  }
  if(label) label.textContent=`APPROX. ${progress}% COMPLETE`;
}

/* the five upcoming planes in the rotation, small format */
function renderUpNext(){
  const wrap=document.getElementById("upnext"); if(!wrap) return;
  let html=`<span class="lbl">NEXT UP</span>`;
  const upcoming=Math.min(5,Math.max(0,flights.length-1));
  for(let j=1;j<=5;j++){
    if(j<=upcoming){
      const f=flights[(currentIdx+j)%flights.length];
      withDelta(f);
      const route=f.orig?.code&&f.dest?.code
        ? `${f.orig.code} → ${f.dest.code}`
        : isAuburnCallsign(f.callsign)?"LOCAL TRAINING":"ROUTE NOT PUBLISHED";
      html+=`<div class="mini">
        ${miniLogo(f.callsign)}
        <div class="mtxt">
          <div class="mcall">${f.callsign}</div>
          <div class="mroute">${route}</div>
          <div class="mmeta">${f.typeName||TYPES[f.type]||f.type||"—"} · ${toWind(f.brg)} ${Math.round(f.brg)}°</div>
        </div>
        <div class="mdist">${f.dist.toFixed(0)}<span style="font-size:11px">mi</span></div>
      </div>`;
    }else{
      html+=`<div class="mini mini-empty">
        <div class="empty-radar dot">·</div>
        <div class="mtxt">
          <div class="mcall">OPEN SKY</div>
          <div class="mroute">AWAITING TRAFFIC</div>
          <div class="mmeta">WITHIN ${CONFIG.radiusMiles} MI</div>
        </div>
      </div>`;
    }
  }
  wrap.innerHTML=html;
}

function setVal(id,val,cls){
  const el=document.getElementById(id); if(!el) return;
  if(el.textContent!==val){
    el.textContent=val;
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  }
  if(cls!==undefined){ el.classList.toggle("up",cls==="up"); el.classList.toggle("dn",cls==="dn"); }
}
function updateTele(f){
  withDelta(f);
  setVal("v-dist",f.dist.toFixed(1));
  setVal("v-dir",`${toWind(f.brg)} · ${Math.round(f.brg)}°`);
  setVal("v-alt",fmt(f.altFt,"ft"));
  setVal("v-spd",fmt(f.gsMph,"mph"));
  setVal("v-trk",`${Math.round(f.track)}° ${toWind(f.track)}`);
  const vr=Math.round(f.vrFpm||0);
  setVal("v-vr",(vr>0?"+":"")+vr.toLocaleString()+"fpm", vr>150?"up":vr<-150?"dn":"");
  updateFlightMap(f);
}

/* =============== ROTATION =============== */
function showPlaneAt(i){
  if(!flights.length){ current=null; return; }
  currentIdx=((i%flights.length)+flights.length)%flights.length;
  current=JSON.parse(JSON.stringify(flights[currentIdx]));
  current.lastReal=Date.now();
  rotateStart=Date.now();
  buildHero(current);
  const nEl=document.getElementById("rotIdx");
  if(nEl) nEl.textContent=`PLANE ${currentIdx+1} OF ${flights.length}`;
}
function flyToPlane(i){
  if(transitioning||flights.length<2) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ showPlaneAt(i); return; }
  transitioning=true;
  const flyby=document.createElement("div");
  flyby.className="plane-transition";
  flyby.setAttribute("aria-hidden","true");
  const plane=document.createElement("img");
  plane.className="fly-plane";
  plane.src=AUBURN_TRANSITION_PLANE;
  plane.alt="";
  flyby.appendChild(plane);
  for(const side of ["port","starboard"]){
    const light=document.createElement("span");
    light.className=`fly-light ${side}`;
    flyby.appendChild(light);
  }
  document.getElementById("stage").appendChild(flyby);

  let swapped=false;
  const swap=()=>{ if(!swapped){ swapped=true; showPlaneAt(i); } };
  const cleanup=()=>{ swap(); flyby.remove(); transitioning=false; };
  setTimeout(swap,780);
  const fallback=setTimeout(cleanup,1900);
  flyby.addEventListener("animationend",()=>{ clearTimeout(fallback); cleanup(); },{once:true});
}
function renderEmpty(){
  disposeFlightMap();
  document.getElementById("hero").innerHTML=
    `<div class="led-bg"></div><div class="sheen"></div><div class="mascot"></div>
     <div class="empty"><div class="msg glow">CLEAR SKIES OVER AUBURN<br><span style="font-size:24px;color:var(--led-dim)">no aircraft within ${CONFIG.radiusMiles} miles</span></div></div>`;
}

/* =============== WIND =============== */
async function tickWind(){
  try{
    const url='https://api.open-meteo.com/v1/forecast'
      +'?latitude='+CONFIG.lat+'&longitude='+CONFIG.lon
      +'&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      +'&wind_speed_unit=mph&timezone=America%2FChicago';
    const res=await timedFetch(url,{},8000);
    if(!res.ok) throw new Error('weather '+res.status);
    const data=await res.json();
    const c=data.current;
    const spd=Math.round(c.wind_speed_10m);
    const gust=Math.round(c.wind_gusts_10m);
    const deg=Math.round(c.wind_direction_10m);
    // wind direction = where wind is coming FROM; arrow points where it blows TO
    document.getElementById('w-spd').textContent=spd;
    document.getElementById('w-dir').textContent=toWind(deg)+' '+deg+'°';
    document.getElementById('w-gust').textContent='gust '+gust+'mph';
    const ptr=document.getElementById('wind-ptr');
    if(ptr) ptr.style.transform='rotate('+deg+'deg)';
  }catch(e){
    // silently keep last known value if fetch fails
  }
}

/* =============== LOOPS =============== */
async function tickData(){
  let list;
  try{ list=await fetchFlights(); demoMode=false; setStatus("LIVE · ADS-B",false); }
  catch(e){ list=JSON.parse(JSON.stringify(DEMO)); list.forEach(f=>f.lastReal=Date.now()); demoMode=true; setStatus("DEMO MODE",true); }

  applyFlightAwareEnrichment(list);
  await enrichAircraftDetails(list);
  list.forEach(withDelta);
  list.sort((a,b)=>a.dist-b.dist);
  flights=list;

  document.getElementById("count").textContent=flights.length;
  document.getElementById("closest").textContent=flights[0]?flights[0].dist.toFixed(1):"--";
  const hi=Math.max(0,...flights.map(f=>f.altFt||0));
  document.getElementById("highest").textContent=hi?Math.round(hi).toLocaleString():"--";

  if(!flights.length){ current=null; renderEmpty(); return; }
  await getRoutes(flights);

  if(current){
    const idx=flights.findIndex(f=>f.hex===current.hex);
    if(idx>=0){
      currentIdx=idx;
      const fresh=flights[idx];
      const hadRoute=!!(current.orig&&current.dest);
      const identityChanged=current.type!==fresh.type||current.typeName!==fresh.typeName||current.callsign!==fresh.callsign||current.reg!==fresh.reg;
      Object.assign(current,{lat:fresh.lat,lon:fresh.lon,altFt:fresh.altFt,gsMph:fresh.gsMph,
        track:fresh.track,vrFpm:fresh.vrFpm,callsign:fresh.callsign,reg:fresh.reg,type:fresh.type,typeName:fresh.typeName,airline:fresh.airline,
        orig:fresh.orig,dest:fresh.dest,lastReal:Date.now()});
      if((!hadRoute&&fresh.orig)||identityChanged) buildHero(current);
      else { updateTele(current); renderUpNext(); }
      const nEl=document.getElementById("rotIdx");
      if(nEl) nEl.textContent=`PLANE ${currentIdx+1} OF ${flights.length}`;
    }else{ showPlaneAt(currentIdx); }
  }else{ showPlaneAt(0); }
}
function tickTelemetry(){
  if(!current) return;
  const now=Date.now(), dt=(now-current.lastReal)/1000;
  current.lastReal=now;
  // dead-reckon hero plane forward
  if(current.gsMph>0){ const d=current.gsMph*(dt/3600); [current.lat,current.lon]=project(current.lat,current.lon,current.track,d); }
  if(current.vrFpm) current.altFt=Math.max(0,(current.altFt||0)+current.vrFpm*(dt/60));
  updateTele(current);
  updateRouteProgress(current);
  // dead-reckon queued planes so next-up distances are live too
  for(let j=1;j<=Math.min(5,flights.length-1);j++){
    const qf=flights[(currentIdx+j)%flights.length];
    if(!qf||!qf.gsMph) continue;
    const qd=qf.gsMph*(dt/3600);
    [qf.lat,qf.lon]=project(qf.lat,qf.lon,qf.track||0,qd);
    if(qf.vrFpm) qf.altFt=Math.max(0,(qf.altFt||0)+qf.vrFpm*(dt/60));
  }
  renderUpNext();
}
function tickRotate(){ if(flights.length>1) flyToPlane(currentIdx+1); }
function tickProgress(){
  const fill=document.getElementById("rotFill"); if(!fill) return;
  fill.style.width=(Math.min(1,(Date.now()-rotateStart)/CONFIG.rotateMs)*100).toFixed(1)+"%";
}
function setStatus(t,demo){ document.getElementById("statusTxt").textContent=t; document.getElementById("status").classList.toggle("demo",demo); }
function tickClock(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-US",{hour12:false}); }
function fitStage(){ document.getElementById("stage").style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`; }

function setTowerState(state,label){
  const control=document.getElementById("towerControl");
  if(!control) return;
  control.dataset.state=state;
  control.setAttribute("aria-pressed",state==="listening"||state==="connecting"?"true":"false");
  control.setAttribute("aria-label",state==="listening"||state==="connecting"
    ?"Turn off the KAUO Ground, Tower, and CTAF radio stream"
    :"Turn on the KAUO Ground, Tower, and CTAF radio stream");
  document.getElementById("towerStatus").textContent=label;
}

function ensureTowerAudio(){
  if(towerAudio) return towerAudio;
  towerAudio=new Audio();
  towerAudio.preload="none";
  towerAudio.volume=.85;
  towerAudio.addEventListener("playing",()=>{ if(towerWanted) setTowerState("listening","LISTENING"); });
  towerAudio.addEventListener("waiting",()=>{ if(towerWanted) setTowerState("connecting","CONNECTING…"); });
  towerAudio.addEventListener("error",()=>{
    if(!towerWanted) return;
    towerWanted=false;
    disconnectTowerAudio();
    setTowerState("blocked","FEED UNAVAILABLE");
  });
  return towerAudio;
}

function disconnectTowerAudio(){
  if(!towerAudio) return;
  towerAudio.pause();
  towerAudio.removeAttribute("src");
  towerAudio.load();
}

async function startTowerAudio(autoStart=false){
  const audio=ensureTowerAudio();
  towerWanted=true;
  setTowerState("connecting","CONNECTING…");
  if(audio.getAttribute("src")!==TOWER_STREAM_URL){
    audio.src=TOWER_STREAM_URL;
    audio.load();
  }
  try{
    await audio.play();
    if(towerWanted) setTowerState("listening","LISTENING");
  }catch(e){
    towerWanted=false;
    disconnectTowerAudio();
    setTowerState("blocked",autoStart?"TAP TO LISTEN":"TRY AGAIN");
  }
}

function stopTowerAudio(){
  towerWanted=false;
  disconnectTowerAudio();
  setTowerState("off","TOWER OFF");
}

function initTowerAudio(){
  document.getElementById("towerControl").addEventListener("click",()=>{
    if(towerWanted) stopTowerAudio();
    else startTowerAudio(false);
  });
  startTowerAudio(true);
}

function scheduleTigerEyes(){
  clearTimeout(tigerEyeTimer);
  const delay=8000+Math.random()*17000;
  tigerEyeTimer=setTimeout(()=>{
    const mascot=document.querySelector(".mascot");
    if(mascot&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
      mascot.classList.remove("eyes-glow");
      void mascot.offsetWidth;
      mascot.classList.add("eyes-glow");
      setTimeout(()=>mascot.classList.remove("eyes-glow"),1500);
    }
    scheduleTigerEyes();
  },delay);
}

async function startBoard(){
  const transitionPreload=new Image(); transitionPreload.src=AUBURN_TRANSITION_PLANE;
  initTowerAudio();
  scheduleTigerEyes();
  await loadFlightAwareCache();
  fitStage(); addEventListener("resize",fitStage);
  tickClock(); setInterval(tickClock,1000);
  tickWind(); setInterval(tickWind,5*60*1000);  // wind refreshes every 5 min
  tickData(); setInterval(tickData,CONFIG.refreshMs);
  setInterval(tickTelemetry,CONFIG.tickMs);
  setInterval(tickProgress,120);
  setInterval(tickRotate,CONFIG.rotateMs);
}
startBoard();
</script>
</body>
</html>
